name: Movable type ledger experiment
on:
  push:
    paths:
      - 'motionbricks/movable_type_ledger.py'
      - 'motionbricks/radix_*.py'
      - 'tests/movable_type_ledger/**'
      - 'tools/movable_type_ledger_demo.py'
      - '.github/workflows/movable-type-ledger.yml'
  pull_request:
    paths:
      - 'motionbricks/movable_type_ledger.py'
      - 'motionbricks/radix_*.py'
      - 'tests/movable_type_ledger/**'
      - 'tools/movable_type_ledger_demo.py'
      - '.github/workflows/movable-type-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: movable-type-ledger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stdlib:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ledger, independent Merkle reference, and storage faults
        run: python -S -W error::ResourceWarning -m unittest discover -s tests/movable_type_ledger -v
      - name: Real repository radix integration
        run: python -S -W error::ResourceWarning tools/movable_type_ledger_demo.py --ipc --out-dir ledger-demo
      - uses: actions/upload-artifact@v4
        with:
          name: movable-type-ledger-${{ matrix.os }}-py${{ matrix.python }}
          path: ledger-demo/
