name: Offline procurement ledger
on:
  push:
    paths: ['motionbricks/procurement.py', 'tests/procurement/**', 'docs/procurement_accountability_zh.md', '.github/workflows/procurement.yml']
  pull_request:
    paths: ['motionbricks/procurement.py', 'tests/procurement/**', 'docs/procurement_accountability_zh.md', '.github/workflows/procurement.yml']
permissions:
  contents: read
jobs:
  offline:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -S -m unittest discover -s tests/procurement -v
      - run: python -S -m motionbricks.procurement
