name: CPU preflight
on:
  push:
  pull_request:
concurrency:
  group: preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record actual OS and architecture
        run: python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Install isolated CPU test dependencies
        run: python -m pip install -r tools/bec_dynamics/requirements.txt
      - name: BEC loss and Hopfield controls
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -m unittest discover -s tests/bec_loss -v
      - run: python -m unittest discover -s tests/bec_dynamics -v
      - run: python -m unittest discover -s tests/cold_atoms -v
      - run: python -m unittest discover -s tests/optical_quantum -v
      - run: python -m unittest discover -s tests/zero_guard -v
      - run: python -S -m unittest discover -s tests/ding_rao -v
      - run: python -m unittest discover -s tests/crew_countdown -v
      - run: python -m unittest discover -s tests/bell_chsh -v
      - run: python -m unittest discover -s tests/root_soil -v
      - run: python -S -m unittest discover -s tests/rally_surface -v
      - run: python -S -m unittest discover -s tests/radix_portability -v
      - run: python -S -m motionbricks.radix_portability --backend all
      - run: python -m unittest discover -s tests/sleep_mode -v
      - run: python -S -m unittest discover -s tests/prebios_power -v
      - run: python -S -m motionbricks.prebios_power --demo
      - name: CPU logical memory and rasterizer checks
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -m unittest discover -s tests/memory_lab -v
      - name: Render 1000 logical shards on the actual runner CPU
        run: |
          python -S -m motionbricks.memory_lab plan --dimms 1000 --dimm-gib 16
          python -m motionbricks.memory_lab run --memory-mib 16 --matrix-size 8 --cache-sizes 16 64 256 --cache-repeats 1 --render /tmp/memory-lab.png --render-width 960 --render-height 640 > /tmp/memory-lab.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-lab-${{ matrix.os }}-py${{ matrix.python }}
          path: /tmp/memory-lab.*
          if-no-files-found: error
      - run: python -m unittest discover -s tests/cpu_reference -v
      - name: Biophysics and civil weather concept checks
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m unittest discover -s tests/weather_concepts -v
          python -m motionbricks.wheal_typhoon --cells 32 --out-dir /tmp/wheal-typhoon
          python -m motionbricks.rs72 --out-dir /tmp/rs72
      - uses: actions/upload-artifact@v4
        with:
          name: weather-concepts-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            /tmp/wheal-typhoon/
            /tmp/rs72/
          if-no-files-found: error
      - run: python -m motionbricks.cpu_reference --validate-only
      - run: python -m unittest discover -s tests/preflight -v
      - run: python -m unittest discover -s tests/examples -v
      - run: python tools/preflight.py --model soma --json
      - run: python tools/preflight.py --model unitree_g1 --json
      - run: python docs/examples/generate_once.py --help
      - run: python docs/examples/locomotion_loop.py --help

  runtime-refusal:
    name: Runtime refusal (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        include:
          - os: ubuntu-24.04
            host: Linux/x86_64
          - os: ubuntu-24.04-arm
            host: Linux/aarch64
          - os: macos-15
            host: Darwin/arm64
    env:
      REFUSAL_EXPECT_HOST: ${{ matrix.host }}
      MOTIONBRICKS_ENGINE_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert safe runtime refusal (expected CLI exits 1 and 2)
        run: python -S -m unittest discover -s tests/runtime_refusal -v
