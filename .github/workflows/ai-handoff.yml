name: AI handoff CPU simulation
on:
  push:
    paths:
      - 'motionbricks/ai_handoff*.py'
      - 'tests/ai_handoff/**'
      - 'tools/ai_handoff/**'
      - 'docs/ai_handoff/**'
      - '.github/workflows/ai-handoff.yml'
  pull_request:
    paths:
      - 'motionbricks/ai_handoff*.py'
      - 'tests/ai_handoff/**'
      - 'tools/ai_handoff/**'
      - 'docs/ai_handoff/**'
      - '.github/workflows/ai-handoff.yml'
permissions:
  contents: read
concurrency:
  group: ai-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record host and run without site packages
        run: |
          python -S -c "import platform; print(platform.platform(), platform.machine(), platform.python_version())"
          python -S -m unittest discover -s tests/ai_handoff -v
      - name: Reproduce exact protocol counters
        run: python -S -m tools.ai_handoff.benchmark --check docs/ai_handoff/results.json
      - name: Record non-normative CPU and elapsed measurements
        run: python -S -m tools.ai_handoff.benchmark --timing --output handoff-host-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ matrix.os }}-py${{ matrix.python }}
          path: handoff-host-results.json
