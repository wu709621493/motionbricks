name: Rust CPU core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - name: Format, test and build without runtime dependencies
        working-directory: native/motionbricks-core
        run: |
          cargo +1.85.0 fmt --check
          cargo +1.85.0 test --locked
          cargo +1.85.0 build --release --locked
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-24.04'
        with:
          python-version: '3.12'
      - name: Install CPU parity oracle
        if: matrix.os == 'ubuntu-24.04'
        run: python -m pip install numpy==1.26.4 torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compare against PyTorch and repository codebook
        if: matrix.os == 'ubuntu-24.04'
        run: python native/motionbricks-core/tests/parity.py
