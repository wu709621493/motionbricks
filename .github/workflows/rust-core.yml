name: Rust CPU core
on:
  push:
    paths: ['native/motionbricks-core/**', 'tools/rust_review/**', 'tests/rust_review/**', 'tools/pyignite/**', 'tools/onnx/models/quantizer.py', 'tools/onnx/models/layers.py', '.github/workflows/rust-core.yml']
  pull_request:
    paths: ['native/motionbricks-core/**', 'tools/rust_review/**', 'tests/rust_review/**', 'tools/pyignite/**', 'tools/onnx/models/quantizer.py', 'tools/onnx/models/layers.py', '.github/workflows/rust-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt
      - name: Format, test and build without runtime dependencies
        working-directory: native/motionbricks-core
        run: |
          rustc -vV
          cargo +1.85.0 fmt --check
          cargo +1.85.0 test --locked --offline
          cargo +1.85.0 build --release --locked --offline
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-24.04'
        with:
          python-version: '3.12'
      - name: Install CPU parity oracle
        if: matrix.os == 'ubuntu-24.04'
        run: python -m pip install numpy==2.3.5 torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compare against PyTorch and repository codebook
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p review-results
          python native/motionbricks-core/tests/parity.py > review-results/rust-parity.json
      - name: Synthetic benchmark (observations, no speed threshold)
        if: matrix.os == 'ubuntu-24.04'
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/pyignite/build.py
          python tools/rust_review/benchmark.py --output review-results/benchmark.json
          python tools/rust_review/retro_audit.py --output review-results/retro.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: rust-review-linux-x86_64
          path: review-results/
          if-no-files-found: error
  pyignite-baseline-regression:
    name: PyIgnite no-new-regression (known PE parity gap)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python tools/pyignite/build.py
      - run: python -m unittest discover -s tests/pyignite -v
      - name: Test regression gate refusal paths
        run: python -m unittest discover -s tests/rust_review -v
      - name: Compare current strict audit with freshly built pinned main
        run: python tools/rust_review/baseline_regression.py --output-dir review-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyignite-independent-review
          path: review-results/
          if-no-files-found: error
