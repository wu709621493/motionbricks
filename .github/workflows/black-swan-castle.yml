name: Black Swan Castle
on:
  push:
    paths: ['experiments/black_swan_castle/**', 'tests/black_swan_castle/**', 'tools/siheyuan/**', '.github/workflows/black-swan-castle.yml']
  pull_request:
    paths: ['experiments/black_swan_castle/**', 'tests/black_swan_castle/**', 'tools/siheyuan/**', '.github/workflows/black-swan-castle.yml']
permissions:
  contents: read
jobs:
  castle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -S -m unittest discover -s tests/black_swan_castle -v
      - run: python -S experiments/black_swan_castle/build.py --check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/castle-review playwright@1.62.1
      - run: /tmp/castle-review/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/castle-review/node_modules node experiments/black_swan_castle/browser_review.cjs /tmp/castle-browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: black-swan-castle-browser-review
          path: /tmp/castle-browser-results
