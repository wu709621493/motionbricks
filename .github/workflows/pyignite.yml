name: PyIgnite prototype
on:
  push:
    paths: ['tools/pyignite/**', 'tests/pyignite/**', 'tools/onnx/models/layers.py', '.github/workflows/pyignite.yml']
  pull_request:
    paths: ['tools/pyignite/**', 'tests/pyignite/**', 'tools/onnx/models/layers.py', '.github/workflows/pyignite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/pyignite/requirements.txt
      - run: python tools/pyignite/build.py
      - name: Bounded native smoke (no NumPy import)
        run: |
          python tools/pyignite/build.py --kind smoke
          python -S tools/pyignite/doctor.py --binary tools/pyignite/build/host/pyignite-smoke --output pyignite-smoke.json
      - run: python -m unittest discover -s tests/pyignite -v
      - name: Install numerical oracle (failure is not a passing parity test)
        run: python -m pip install -r tools/pyignite/requirements-validation.txt
      - run: python tools/pyignite/validate.py --output pyignite-parity.json
      - run: python tools/pyignite/memory.py native > pyignite-memory-native.json
      - run: python tools/pyignite/memory.py torch > pyignite-memory-torch.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyignite-${{ matrix.os }}
          path: pyignite-*.json
  verified-subsets-and-wheel:
    name: PyIgnite subsets / ${{ matrix.os }} / Torch ${{ matrix.torch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            torch: '2.14.0'
            numpy: '1.26.4'
          - os: ubuntu-24.04-arm
            torch: '2.14.0'
            numpy: '1.26.4'
          - os: macos-15
            torch: '2.14.0'
            numpy: '1.26.4'
          - os: ubuntu-24.04
            torch: '2.15.0'
            numpy: '2.3.5'
          - os: ubuntu-24.04-arm
            torch: '2.15.0'
            numpy: '2.3.5'
          - os: macos-15
            torch: '2.15.0'
            numpy: '2.3.5'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==${{ matrix.numpy }} build -r tools/pyignite/requirements-review.txt
      - if: runner.os == 'Linux'
        run: python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: python -m pip install torch==${{ matrix.torch }}
      - run: python tools/pyignite/build.py
      - run: python -m unittest discover -s tests/pyignite -v
      - name: New subset parity and single-request timings
        run: python tools/pyignite/review.py --output review-results/subsets.json
      - name: Preserve the existing dynamic PE audit and baseline regression
        run: python tools/rust_review/baseline_regression.py --output-dir review-results/legacy
      - name: Download the released G1 root checkpoint for the explicit subset test
        if: matrix.os == 'ubuntu-24.04' && matrix.torch == '2.14.0'
        run: curl --fail --location --max-time 180 'https://huggingface.co/nvidia/MotionBricks/resolve/main/g1/out/motionbricks_root/version_1/checkpoints/model-step%3D2000000.safetensors' --output "$RUNNER_TEMP/g1-root.safetensors"
      - name: Hash-verified real G1 weights with synthetic inputs
        if: matrix.os == 'ubuntu-24.04' && matrix.torch == '2.14.0'
        run: python tools/pyignite/review.py --g1-root "$RUNNER_TEMP/g1-root.safetensors" --output review-results/g1-subset.json
      - run: python -m build tools/pyignite --outdir wheelhouse
      - name: Verify native macOS wheel tag
        if: runner.os == 'macOS'
        run: |
          python -c "import pathlib,platform; p=next(pathlib.Path('wheelhouse').glob('*.whl')); assert p.name.endswith('_'+platform.machine()+'.whl'), p"
      - name: Install wheel in a clean venv and run outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pyignite-wheel"
          "$RUNNER_TEMP/pyignite-wheel/bin/python" -m pip install numpy==${{ matrix.numpy }} wheelhouse/*.whl
          cp tools/pyignite/wheel_smoke.py "$RUNNER_TEMP/wheel_smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pyignite-wheel/bin/python" -I wheel_smoke.py > "$GITHUB_WORKSPACE/review-results/wheel-smoke.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyignite-v02-${{ matrix.os }}-${{ matrix.torch }}
          path: |
            review-results/
            wheelhouse/
          if-no-files-found: error
  legacy-32-build-and-host-abi:
    name: Legacy ${{ matrix.profile }} build / modern host ABI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [p5-x87, ia32-sse2]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GCC multilib (modern glibc; not a Pentium sysroot)
        run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - name: Build explicit ELF32 library and standalone smoke
        run: |
          python tools/pyignite/build.py --profile ${{ matrix.profile }} --output legacy-results/libpyignite.so
          python tools/pyignite/build.py --profile ${{ matrix.profile }} --kind smoke --output legacy-results/pyignite-smoke
          file legacy-results/libpyignite.so legacy-results/pyignite-smoke > legacy-results/file.txt
          readelf -h legacy-results/pyignite-smoke > legacy-results/elf.txt
      - name: Execute on modern x86-64 host (no physical legacy CPU claim)
        run: python -S tools/pyignite/doctor.py --binary legacy-results/pyignite-smoke --output legacy-results/host-abi-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyignite-legacy-${{ matrix.profile }}
          path: legacy-results/
          if-no-files-found: error

